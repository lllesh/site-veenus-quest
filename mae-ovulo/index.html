<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;800;900&display=swap">
<style>
:root{
  --bg:#FBFAF8; --ink:#2B2729; --muted:#6F6769; --line:#ECE6E3;
  --rosa:#F48591; --coral:#FA8D85; --pessego:#FEA283; --laranja:#FFB872; --salvia:#8DA599; --verm:#AC0000;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,-apple-system,sans-serif;font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding-inline:20px}

/* topo com as páginas */
nav.paginas{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
nav.paginas .wrap{display:flex;gap:8px;align-items:center;overflow-x:auto;padding-block:14px;scrollbar-width:none}
nav.paginas .wrap::-webkit-scrollbar{display:none}
nav.paginas .marca{font-weight:900;letter-spacing:-.02em;font-size:18px;margin-right:10px;white-space:nowrap}
nav.paginas a{flex:none;text-decoration:none;color:var(--ink);font-size:13px;font-weight:600;padding:9px 14px;border-radius:999px;background:var(--c,#eee);white-space:nowrap;transition:transform .2s}
nav.paginas a:hover,nav.paginas a:focus-visible{transform:translateY(-2px);outline:none}
nav.paginas a.ativo{background:var(--ink);color:#fff}
nav.paginas .pilula{flex:none;font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;background:color-mix(in srgb,var(--laranja) 55%,#fff);color:var(--ink);white-space:nowrap}

/* abertura, com a leitura que acende igual ao Rebirth */
.abre{padding-block:14vh 4vh}
.abre h1{margin:0;font-weight:900;font-size:clamp(76px,17vw,240px);line-height:.82;letter-spacing:-.06em}
.abre h1 span{display:inline-block}
.abre h1 .p1{color:var(--rosa)}.abre h1 .p2{color:var(--coral)}.abre h1 .p3{color:var(--pessego)}.abre h1 .p4{color:var(--laranja)}.abre h1 .p5{color:var(--salvia)}.abre h1 .p6{color:var(--verm)}
.abre .sub{margin-top:56px;font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
.leitura{position:relative}
.leitura p{position:sticky;margin:0;font-weight:800;font-size:clamp(30px,5.2vw,72px);line-height:1.05;letter-spacing:-.035em;max-width:17ch}
.leitura .t{color:rgba(43,39,41,.13);transition:color .45s ease}
.leitura .t.on{color:var(--ink)}

/* cada página do site */
section.pag{padding-block:12vh 4vh}
.cab{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-bottom:40px}
.cab .num{font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
.cab h2{margin:0;font-weight:900;font-size:clamp(52px,10vw,132px);line-height:.85;letter-spacing:-.05em;color:var(--c)}
.cab .ver{font-size:13px;font-weight:600;color:var(--ink);text-decoration:none;border-bottom:2px solid var(--c);padding-bottom:3px;white-space:nowrap}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:color-mix(in srgb,var(--c) 16%,#fff);border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.largo{grid-column:1/-1}
.card .tipo{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:color-mix(in srgb,var(--c) 55%,#2B2729)}
.card textarea{width:100%;font:600 19px/1.3 "Figtree",system-ui,sans-serif;letter-spacing:-.01em;color:var(--ink);background:#fff;border:0;border-radius:12px;padding:14px;resize:none;overflow:hidden;min-height:56px;outline:2px solid transparent;transition:outline-color .2s}
.card textarea:focus{outline-color:var(--verm)}
.card .par{display:grid;grid-template-columns:1fr 2fr;gap:8px}
.card .par textarea{min-height:56px}
.card .orig{font-size:12.5px;color:var(--muted);margin:0;overflow-wrap:anywhere}
.card .orig b{font-weight:600}
.midia{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:#fff;max-width:100%}
.midia img,.midia video{width:100%;height:100%;object-fit:cover;display:block}
.acoes{display:flex;gap:8px;flex-wrap:wrap}
button{font:600 12px/1 "Figtree",system-ui,sans-serif;letter-spacing:.14em;text-transform:uppercase;padding:12px 16px;border-radius:999px;border:2px solid var(--verm);background:var(--verm);color:#fff;cursor:pointer}
button.leve{background:transparent;color:var(--verm)}
button:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
button[disabled]{opacity:.5;cursor:default}
.mudou{font-size:10px;letter-spacing:.14em;padding:5px 8px;border-radius:999px;background:var(--verm);color:#fff}

/* aparece ao rolar */
.rv{opacity:0;transform:translateY(44px);transition:opacity .8s ease,transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
.sem-js .rv{opacity:1;transform:none}

/* salvar */
#status{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:30;font:700 12px/1 "Figtree",system-ui,sans-serif;letter-spacing:.18em;text-transform:uppercase;padding:14px 20px;border-radius:999px;background:var(--verm);color:#fff;box-shadow:0 8px 24px rgba(0,0,0,.18)}
#status.leve{background:#fff;color:var(--verm)}

/* senha, se faltar */
#entrar{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px}
#entrar form{display:flex;flex-direction:column;gap:16px;width:min(320px,100%);text-align:center}
#entrar label{font-size:12px;font-weight:600;letter-spacing:.3em;text-transform:uppercase}
#entrar input{font:inherit;font-size:22px;text-align:center;letter-spacing:.3em;padding:12px;border:2px solid var(--ink);border-radius:999px;background:transparent;outline:none}
#entrar input:focus{border-color:var(--verm)}
.fim{padding-block:14vh 22vh;text-align:center;color:var(--muted);font-size:13px;letter-spacing:.2em;text-transform:uppercase}

@media (max-width:560px){.card .par{grid-template-columns:1fr 1.6fr}.card textarea{font-size:17px}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rv{opacity:1;transform:none;transition:none}.leitura .t{transition:none}}
</style>

<body class="sem-js">

<div id="entrar" hidden>
  <form id="fe"><label for="senha">senha pra editar</label><input id="senha" type="password" inputmode="numeric" autocomplete="current-password"><button>entrar</button><p id="fem" style="margin:0;min-height:1.2em"></p></form>
</div>

<div id="app" hidden>
  <nav class="paginas"><div class="wrap" id="nav"><span class="pilula">A Mãe do Óvulo</span></div></nav>

  <header class="wrap abre">
    <h1 style="color:var(--laranja)">A Mãe do Óvulo</h1>
    <div class="sub">livro.ink · textos, fotos e vídeos</div>
  </header>

  <div class="wrap leitura"><p id="intro">Aqui a senhora troca qualquer texto, foto ou vídeo do livro.ink. Escreveu, salvou sozinho, e aparece no site na mesma hora. Nada se perde: cada mudança fica guardada no histórico.</p></div>

  <main id="lista"></main>
  <div class="fim">fim do painel</div>
  <div id="status">carregando…</div>
</div>

<script src="/titulo-fixo.js"></script>
<script>
(function () {
  document.body.classList.remove('sem-js');
  var CORES = ['var(--rosa)', 'var(--coral)', 'var(--pessego)', 'var(--laranja)', 'var(--salvia)'];
  var PARES = { 'R': ['educe®', 'Logo'], 'M': ['enu', 'Menu'], 'C': ['lose', 'Fechar'], 'S': ['tudio', 'Studio (no menu)'] };
  var CHAVE = null; try { CHAVE = localStorage.getItem('sr1-chave') } catch (e) {}
  var SAVED = {}, PEND = {}, ORIG = {}, t = 0;
  var st = document.getElementById('status');
  function hora() { var d = new Date(); return ('0' + d.getHours()).slice(-2) + ':' + ('0' + d.getMinutes()).slice(-2) }
  function status(txt, leve) { st.textContent = txt; st.className = leve ? 'leve' : '' }

  // senha
  function pedirSenha() {
    document.getElementById('entrar').hidden = false;
    document.getElementById('fe').addEventListener('submit', function (e) {
      e.preventDefault(); var v = document.getElementById('senha').value.trim(), m = document.getElementById('fem'); m.textContent = 'conferindo…';
      fetch('/api/entrar', { method: 'POST', headers: { 'x-edit-key': v } }).then(function (r) { return r.json() }).then(function (j) {
        if (j.ok) { try { localStorage.setItem('sr1-chave', v) } catch (x) {} location.reload() } else m.textContent = 'senha errada';
      }).catch(function () { m.textContent = 'sem conexão, tenta de novo' });
    });
  }

  // salvar
  function agenda() { status('salvando…'); clearTimeout(t); t = setTimeout(salvar, 800) }
  function salvar() {
    var lista = Object.keys(PEND).map(function (k) { return { chave: k, html: PEND[k] } }); if (!lista.length) return;
    var envio = PEND; PEND = {};
    fetch('/api/textos', { method: 'POST', headers: { 'Content-Type': 'application/json', 'x-edit-key': CHAVE }, body: JSON.stringify({ blocos: lista }) })
      .then(function (r) { if (r.status === 401) { status('senha expirou · entre de novo'); throw 0 } if (!r.ok) throw new Error(r.status); return r.json() })
      .then(function () { Object.assign(SAVED, envio); status('salvo ' + hora()); marcaTudo() })
      .catch(function () { Object.keys(envio).forEach(function (k) { if (!(k in PEND)) PEND[k] = envio[k] }); status('sem conexão · tentando de novo'); clearTimeout(t); t = setTimeout(salvar, 4000) });
  }
  addEventListener('beforeunload', function (e) { if (Object.keys(PEND).length) { salvar(); e.preventDefault(); e.returnValue = '' } });

  function atual(k) { return SAVED[k] != null ? SAVED[k] : ORIG[k] }
  function mudou(k) { return SAVED[k] != null && SAVED[k] !== ORIG[k] }
  var marcas = [];
  function marcaTudo() { marcas.forEach(function (m) { m.el.hidden = !m.teste() }) }

  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e }
  function cresce(ta) { ta.style.height = 'auto'; ta.style.height = ta.scrollHeight + 'px' }
  function campo(k) {
    var ta = el('textarea'); ta.value = atual(k); ta.rows = 1; ta.spellcheck = true; ta.setAttribute('aria-label', 'texto: ' + ORIG[k]);
    ta.addEventListener('input', function () { PEND[k] = ta.value; SAVED[k] = ta.value; cresce(ta); agenda(); marcaTudo() });
    requestAnimationFrame(function () { cresce(ta) }); addEventListener('resize', function () { cresce(ta) });
    return ta;
  }
  function volta(chaves, campos) {
    var b = el('button', 'leve', 'voltar ao original'); b.type = 'button';
    b.addEventListener('click', function () { chaves.forEach(function (k, i) { PEND[k] = ORIG[k]; SAVED[k] = ORIG[k]; if (campos[i]) { campos[i].value = ORIG[k]; cresce(campos[i]) } }); salvar(); marcaTudo() });
    return b;
  }
  function selo(chaves) { var s = el('span', 'mudou', 'trocado'); marcas.push({ el: s, teste: function () { return chaves.some(mudou) } }); s.hidden = !chaves.some(mudou); return s }

  function cardTexto(it, cor) {
    var c = el('div', 'card rv'); c.style.setProperty('--c', cor); if (it.original.length > 90) c.classList.add('largo');
    var tp = el('div', 'tipo'); tp.appendChild(el('span', '', 'texto')); tp.appendChild(selo([it.chave])); c.appendChild(tp);
    var ta = campo(it.chave); c.appendChild(ta);
    var o = el('p', 'orig'); o.appendChild(el('b', '', 'original: ')); o.appendChild(document.createTextNode(it.original)); c.appendChild(o);
    var a = el('div', 'acoes'); a.appendChild(volta([it.chave], [ta])); c.appendChild(a);
    return c;
  }
  function cardPar(a1, a2, nome, cor) {
    var c = el('div', 'card rv'); c.style.setProperty('--c', cor);
    var tp = el('div', 'tipo'); tp.appendChild(el('span', '', nome + ' · em duas partes')); tp.appendChild(selo([a1.chave, a2.chave])); c.appendChild(tp);
    var par = el('div', 'par'), t1 = campo(a1.chave), t2 = campo(a2.chave); par.appendChild(t1); par.appendChild(t2); c.appendChild(par);
    var o = el('p', 'orig'); o.appendChild(el('b', '', 'original: ')); o.appendChild(document.createTextNode(a1.original + ' + ' + a2.original)); c.appendChild(o);
    var a = el('div', 'acoes'); a.appendChild(volta([a1.chave, a2.chave], [t1, t2])); c.appendChild(a);
    return c;
  }
  function cardMidia(it, cor) {
    var video = it.tipo === 'video', c = el('div', 'card rv'); c.style.setProperty('--c', cor);
    var tp = el('div', 'tipo'); tp.appendChild(el('span', '', video ? 'vídeo' : 'foto')); tp.appendChild(selo([it.chave])); c.appendChild(tp);
    var box = el('div', 'midia'), m;
    function mostra() {
      box.textContent = '';
      if (video) { m = el('video'); m.muted = true; m.loop = true; m.autoplay = true; m.playsInline = true; m.setAttribute('playsinline', ''); m.preload = 'metadata' } else { m = el('img'); m.loading = 'lazy'; m.alt = '' }
      m.src = atual(it.chave); box.appendChild(m);
    }
    mostra(); c.appendChild(box);
    var a = el('div', 'acoes'), b = el('button', '', video ? 'trocar vídeo' : 'trocar foto'); b.type = 'button';
    var inp = el('input'); inp.type = 'file'; inp.accept = video ? 'video/*' : 'image/*'; inp.hidden = true;
    b.addEventListener('click', function () { inp.value = ''; inp.click() });
    inp.addEventListener('change', function () {
      var f = inp.files && inp.files[0]; if (!f) return;
      b.disabled = true; b.textContent = 'enviando…'; status(video ? 'enviando vídeo…' : 'enviando foto…');
      (video ? Promise.resolve(f) : reduz(f)).then(function (blob) {
        var ext = video ? ((f.name.split('.').pop() || 'mp4').toLowerCase()) : 'jpg';
        return fetch('/api/upload?tipo=' + (video ? 'video' : 'foto') + '&ext=' + ext, { method: 'POST', headers: { 'x-edit-key': CHAVE } })
          .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json() })
          .then(function (j) { return fetch(j.envio, { method: 'PUT', headers: { 'Content-Type': blob.type || (video ? 'video/mp4' : 'image/jpeg') }, body: blob }).then(function (r) { if (!r.ok) throw new Error(r.status); return j.url }) });
      }).then(function (url) { PEND[it.chave] = url; SAVED[it.chave] = url; mostra(); salvar(); marcaTudo() })
        .catch(function () { status(video ? 'o vídeo não foi · tenta de novo' : 'a foto não foi · tenta de novo') })
        .then(function () { b.disabled = false; b.textContent = video ? 'trocar vídeo' : 'trocar foto' });
    });
    var v = volta([it.chave], []); v.addEventListener('click', function () { setTimeout(mostra, 0) });
    a.appendChild(b); a.appendChild(v); a.appendChild(inp); c.appendChild(a);
    return c;
  }
  function reduz(f) {
    return new Promise(function (ok) {
      if (!/^image\/(jpeg|png|webp)/.test(f.type)) return ok(f);
      var img = new Image(); img.onload = function () {
        var max = 2600, w = img.naturalWidth, h = img.naturalHeight, s = Math.min(1, max / Math.max(w, h));
        var cv = document.createElement('canvas'); cv.width = Math.round(w * s); cv.height = Math.round(h * s);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        cv.toBlob(function (b) { ok(b || f) }, 'image/jpeg', 0.9); URL.revokeObjectURL(img.src);
      }; img.onerror = function () { ok(f) }; img.src = URL.createObjectURL(f);
    });
  }

  function monta(paginas) {
    var lista = document.getElementById('lista'), nav = document.getElementById('nav');
    paginas.forEach(function (p, i) {
      var cor = CORES[i % CORES.length], id = 'p' + i;
      p.itens.forEach(function (it) { ORIG[it.chave] = it.original });
      var sec = el('section', 'pag wrap'); sec.id = id; sec.style.setProperty('--c', cor);
      var cab = el('div', 'cab rv'), esq = el('div');
      esq.appendChild(el('div', 'num', (i === 0 ? 'aparece em' : 'página ' + i) + ' · ' + p.itens.length + ' itens'));
      esq.appendChild(el('h2', '', p.nome)); cab.appendChild(esq);
      if (p.caminho) { var ver = el('a', 'ver', 'ver no site ↗'); ver.href = p.caminho; ver.target = '_blank'; ver.rel = 'noopener'; cab.appendChild(ver) }
      sec.appendChild(cab);
      var g = el('div', 'grade'), usados = {};
      var porOrig = {}; p.itens.forEach(function (it) { if (it.tipo === 'texto') porOrig[it.original] = it });
      p.itens.forEach(function (it) {
        if (usados[it.chave]) return;
        if (it.tipo === 'texto' && PARES[it.original] && porOrig[PARES[it.original][0]]) {
          var b2 = porOrig[PARES[it.original][0]]; usados[b2.chave] = 1; usados[it.chave] = 1;
          g.appendChild(cardPar(it, b2, PARES[it.original][1], cor)); return;
        }
        if (it.tipo === 'texto' && Object.keys(PARES).some(function (k) { return PARES[k][0] === it.original && porOrig[k] })) return;
        usados[it.chave] = 1;
        g.appendChild(it.tipo === 'texto' ? cardTexto(it, cor) : cardMidia(it, cor));
      });
      sec.appendChild(g); lista.appendChild(sec);
      
    });
    // aparece ao rolar
    var io = new IntersectionObserver(function (es) { es.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add('in'); io.unobserve(e.target) } }) }, { rootMargin: '0px 0px -8% 0px' });
    document.querySelectorAll('.rv').forEach(function (x) { io.observe(x) });
    // marca a página em que a senhora está
    var secs = [].slice.call(document.querySelectorAll('section.pag')), links = [].slice.call(nav.querySelectorAll('a'));
    function qual() { var y = innerHeight * 0.35, at = null; secs.forEach(function (s) { if (s.getBoundingClientRect().top < y) at = s.id }); links.forEach(function (l) { var on = l.dataset.alvo === at; l.classList.toggle('ativo', on); if (on && l.scrollIntoView && nav.__ult !== at) { nav.__ult = at; nav.scrollTo({ left: l.offsetLeft - 80, behavior: 'smooth' }) } }) }
    addEventListener('scroll', qual, { passive: true }); qual();
  }

  // abertura: o parágrafo fica parado e cada trecho acende, igual ao Rebirth
  function leitura() {
    var p = document.getElementById('intro'), ps = p.textContent.split(/(\s+)/), partes = [], a = '', n = 0;
    ps.forEach(function (w) { if (/^\s+$/.test(w)) { a += w; return } a += w; n++; if (/[,.:;]$/.test(w) || n >= 6) { partes.push(a); a = ''; n = 0 } }); if (a) partes.push(a);
    p.textContent = ''; var ts = partes.map(function (x) { var s = el('span', 't', x); p.appendChild(s); return s });
    var esp = el('div'); p.after(esp);
    function ajusta() { var h = p.offsetHeight, vh = innerHeight, t0 = window.srTopo ? srTopo() : 90; p.style.top = (t0 + Math.max(0, (vh - t0 - h) / 2)) + 'px'; esp.style.height = Math.round(ts.length * vh * 0.22) + 'px'; roda() }
    function roda() { var nat = esp.getBoundingClientRect().top - p.offsetHeight, prog = ((parseFloat(p.style.top) || 0) - nat) / Math.max(1, esp.offsetHeight), at = Math.min(ts.length - 1, Math.floor(prog * ts.length)); ts.forEach(function (s, i) { s.classList.toggle('on', i === at) }) }
    addEventListener('scroll', roda, { passive: true }); addEventListener('resize', ajusta);
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(ajusta); ajusta();
  }

  if (!CHAVE) return pedirSenha();
  fetch('/api/textos?check=1', { headers: { 'x-edit-key': CHAVE } }).then(function (r) { return r.json() }).then(function (j) {
    if (!j.ok) { try { localStorage.removeItem('sr1-chave') } catch (e) {} return pedirSenha() }
    return Promise.all([fetch('/mae-ovulo/itens.json').then(function (r) { return r.json() }), fetch('/api/textos').then(function (r) { return r.json() })]).then(function (res) {
      (res[1] || []).forEach(function (r) { SAVED[r.chave] = r.html });
      document.getElementById('app').hidden = false; monta(res[0]); window.srTituloFixo && srTituloFixo(); leitura(); status('salvo', true); if (location.hash) { var alvo = document.querySelector(location.hash); if (alvo) { document.documentElement.style.scrollBehavior = 'auto'; alvo.querySelectorAll('.rv').forEach(function (x) { x.classList.add('in') }); alvo.scrollIntoView(); document.documentElement.style.scrollBehavior = '' } }
    });
  }).catch(function () { status('sem conexão · recarregue a página') ; document.getElementById('app').hidden = false });
